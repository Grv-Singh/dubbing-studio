<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DubForge — Dubbing Studio</title>
  <meta name="description" content="Simple mobile dubbing & voice recording studio" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- TOP BAR -->
<header class="top-bar">
  <canvas id="waveCanvas" class="topbar-wave-canvas"></canvas>
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="url(#lg)" stroke-width="2"/><path d="M8 9v6M12 6v12M16 9v6" stroke="url(#lg2)" stroke-width="2.2" stroke-linecap="round"/><defs><linearGradient id="lg" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><linearGradient id="lg2" x1="8" y1="6" x2="16" y2="18" gradientUnits="userSpaceOnUse"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs></svg>
    <span>DubForge</span>
  </div>
  <div class="top-right">
    <div class="time-display-pill" id="timeDisplay">00:00.0</div>
    <button class="icon-btn" id="btnMicToggle" title="Pause/Mute Mic Stream" style="width:34px; height:34px; border-radius:8px;">
      <svg id="iconMicOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      <svg id="iconMicOff" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 11v-1M5 10v1a6.93 6.93 0 0 0 1.11 3.77"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
    </button>
    <div class="status-pill" id="statusPill">● Ready</div>
    <button class="icon-btn" id="settingsBtn" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>
    </button>
  </div>
</header>

<!-- FIXED TOP DASHBOARD -->
<div class="top-dashboard">
  <!-- VIDEO DISPLAY -->
  <section class="video-card">
    <video id="dubVideo" src="vid.mp4" muted playsinline></video>
    <label class="choose-video-btn" title="Choose Video">
      📁 Choose Video
      <input type="file" id="videoUpload" accept="video/*" style="display:none;"/>
    </label>
  </section>

  <!-- TABS -->
  <div class="tab-bar-wrap">
    <div class="tab-bar">
      <button class="tab active" data-tab="script">📄 Script</button>
      <button class="tab" data-tab="takes">🎙️ Takes</button>
    </div>
  </div>
</div>

<!-- MAIN SCROLL AREA -->
<main class="app-main">

  <!-- SCRIPT TAB (active by default) -->
  <div class="tab-panel active" id="panel-script">
    <div class="card script-panel-card">
      <div class="card-title-row">
        <span class="card-title">📄 Script Teleprompter</span>
        <div style="display:flex;gap:8px;align-items:center">
          <span style="font-size:12px;color:var(--muted)">Scroll</span>
          <label class="toggle"><input type="checkbox" id="autoScrollToggle" checked/><span class="slider"></span></label>
          <button class="icon-btn" id="editScriptBtn" title="Edit script" style="width:32px;height:32px;border-radius:8px">✏️</button>
        </div>
      </div>
      <!-- Speed control -->
      <div class="row-control" style="margin-top:2px; margin-bottom:8px;">
        <label style="width:auto;white-space:nowrap">🐢 Speed</label>
        <input type="range" id="scrollSpeed" min="1" max="10" value="7" class="ctrl-range"/>
        <span class="ctrl-val" id="scrollSpeedVal">7</span>
        <label style="width:auto;white-space:nowrap;margin-left:2px">🐇</label>
      </div>
      <!-- FULL HEIGHT TELEPROMPTER VIEW -->
      <div id="teleprompterView" class="teleprompter">
        <div id="teleprompterContent"></div>
      </div>
      <!-- EDIT VIEW (hidden by default) -->
      <textarea id="dubScript" class="script-textarea" style="display:none" placeholder="Script paste karo..."></textarea>
    </div>
  </div>

  <!-- TAKES TAB -->
  <div class="tab-panel" id="panel-takes">
    <div id="takeList">
      <div class="empty-state">No takes yet — hit ⏺ to record!</div>
    </div>
  </div>

</main>

<!-- FIXED BOTTOM CONTROL DOCK -->
<footer class="bottom-dock">


  <!-- TRANSPORT -->
  <section class="transport-section">
    <button class="trans-btn" id="btnRewind" title="Rewind">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5"/></svg>
    </button>
    <button class="trans-btn record-btn" id="btnRecord" title="Record">
      <span class="rec-dot"></span>
    </button>
    <button class="trans-btn play-btn" id="btnPlayPause" title="Play">
      <svg id="iconPlay" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <svg id="iconPause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
    <button class="trans-btn stop-btn" id="btnStop" title="Stop">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
    </button>
  </section>
</footer>

<!-- SETTINGS MODAL -->
<div class="modal-bg" id="settingsModal" style="display:none">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Settings</h3>
      <button class="icon-btn" id="closeSettings">✕</button>
    </div>
    <div class="modal-body">
      <!-- Microphone settings inside settings modal -->
      <div class="row-control">
        <label>Mic Input</label>
        <select id="inputDevice" class="ctrl-select"></select>
      </div>
      <div class="row-control">
        <label>Monitor Voice</label>
        <label class="toggle"><input type="checkbox" id="monitorToggle"/><span class="slider"></span></label>
      </div>
      <div class="row-control">
        <label>Sample Rate</label>
        <select id="sampleRate" class="ctrl-select">
          <option value="44100">44,100 Hz</option>
          <option value="48000" selected>48,000 Hz</option>
          <option value="96000">96,000 Hz</option>
        </select>
      </div>
      <div class="row-control">
        <label>Bit Depth</label>
        <select id="bitDepth" class="ctrl-select">
          <option value="16">16-bit</option>
          <option value="24" selected>24-bit</option>
          <option value="32">32-bit Float</option>
        </select>
      </div>
      <div class="row-control">
        <label>Format</label>
        <select id="exportFormat" class="ctrl-select">
          <option value="wav">WAV (Lossless)</option>
          <option value="webm" selected>WebM</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-primary" id="saveSettings">Save</button>
    </div>
  </div>
</div>

<!-- HIDDEN PRESET CONTROLS FOR APP.JS COMPATIBILITY -->
<div style="display:none">
  <input type="range" id="inputGain" min="0" max="500" value="320"/>
  <span id="inputGainVal">320%</span>
  
  <input type="range" id="eqLow" min="-12" max="12" value="0"/>
  <span id="eqLowVal">0dB</span>
  <input type="range" id="eqMid" min="-12" max="12" value="0"/>
  <span id="eqMidVal">0dB</span>
  <input type="range" id="eqHigh" min="-12" max="12" value="0"/>
  <span id="eqHighVal">0dB</span>
  
  <input type="checkbox" id="reverbToggle"/>
  <input type="range" id="reverbSize" min="0" max="100" value="15"/>
  <span id="reverbSizeVal">15%</span>
  <input type="range" id="reverbWet" min="0" max="100" value="0"/>
  <span id="reverbWetVal">0%</span>
  
  <input type="checkbox" id="gateToggle"/>
  <input type="range" id="gateThresh" min="-80" max="-10" value="-37"/>
  <span id="gateThreshVal">-37dB</span>
  
  <input type="range" id="pitchShift" min="-12" max="12" value="0"/>
  <span id="pitchShiftVal">0 st</span>
  
  <input type="range" id="masterVol" min="0" max="500" value="200"/>
  <span id="masterVolVal">+6.0dB</span>
</div>

<script src="app.js"></script>
</body>
</html>
